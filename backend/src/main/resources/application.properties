# Server Configuration
server.port=8085

# Application Name
spring.application.name=jucas-catering-backend

# Optional import of local git-ignored secrets
spring.config.import=optional:file:./local.properties

# H2 Persistent File Database (Stores data in ./data/jucasdb.mv.db so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/jucasdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Available at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Groq LLM Configuration for AI Agent (Set via GROQ_API_KEY env or local.properties)
groq.api.key=${GROQ_API_KEY:YOUR_GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=qwen/qwen3.8-27b
